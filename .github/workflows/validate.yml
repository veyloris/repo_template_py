name: Validate

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Rapid successive pushes to the same PR supersede each other; cancel the
# stale run instead of paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv is NOT preinstalled on GitHub-hosted runner images. It reads
      # .python-version and installs that interpreter itself, so there is no
      # separate setup-python step to keep in sync.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      # --locked fails if uv.lock is stale against pyproject.toml, and every
      # install is verified against the hashes recorded in the lock.
      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest

      # The tests run against the editable install from `uv sync`, which reads
      # src/ directly; only the built wheel shows what users get. Build it and
      # run its console script in an environment that holds nothing else.
      - name: Build and run the wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv run --isolated --no-project --with "$RUNNER_TEMP"/dist/*.whl my-app version
